services:
  db:
    image: postgres:16-alpine
    container_name: meetingroom-db-prd
    restart: unless-stopped
    environment:
      POSTGRES_DB: meetingroom_db
      POSTGRES_USER: meetingroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - meetingroom_db_prd:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetingroom -d meetingroom_db"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meetingroom-backend-prd
    restart: unless-stopped
    env_file:
      - .env.prd
    environment:
      NODE_ENV: production
      PORT: "3001"
      # DB는 같은 compose의 db를 바라봄
      DATABASE_URL: "postgresql://meetingroom:${POSTGRES_PASSWORD}@db:5432/meetingroom_db?schema=public"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -lc "npx prisma migrate deploy &&
              node dist/server.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetingroom-frontend-prd
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  meetingroom_db_prd:

