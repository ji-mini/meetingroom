name: DevDeploy (EC2 Self-Hosted)

on:
  push:
    branches: ["develop"]

concurrency:
  group: meetingroom-dev-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, dev, meetingroom]
    steps:
      - name: Deploy on EC2
        run: |
          set -e
          ~/meetingroom/deploy-dev.sh
