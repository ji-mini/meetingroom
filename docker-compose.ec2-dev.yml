services:
  nginx:
    restart: unless-stopped
    build:
      context: .
      dockerfile: nginx/Dockerfile.ec2-dev
    container_name: meetingroom-nginx-ec2-dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.ec2-dev
    container_name: meetingroom-backend-ec2-dev
    env_file:
      - .env.ec2-dev
    environment:
      NODE_ENV: development
      PORT: "3001"
      # 나머지 환경변수(DATABASE_URL, FRONTEND_BASE_URL 등)는 .env.ec2-dev에서 주입
    command: >
      sh -lc "npm run prisma:generate &&
              npx prisma migrate deploy &&
              node dist/server.js"


