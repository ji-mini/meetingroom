## EC2 dev reverse proxy (HTTP only)
## 목표:
## - http://<public-ip>/        -> static (dist) served by Nginx
## - http://<public-ip>/api     -> backend  (3001)
##
## - 포트 번호 제거
## - 동일 오리진으로 CORS 부담 최소화
## - 추후 HTTPS(443) 붙이기 쉬운 구조

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # 기본 로그 포맷
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  keepalive_timeout  65;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API -> backend (Express, 3001)
    location ^~ /api/ {
      proxy_pass http://backend:3001/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api (trailing slash 없는 케이스)도 backend로
    location = /api {
      proxy_pass http://backend:3001/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (정적 파일 서빙)
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}

