services:
  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: meetingroom-backend-dev
    ports:
      - "3001:3001"
    env_file:
      - /home/ec2-user/apps/meetingroom/env/backend.dev.env
    volumes:
      - ./backend:/app
      - backend_node_modules_dev:/app/node_modules
    command: >
      sh -lc "npm run prisma:generate &&
              npx prisma migrate deploy &&
              npm run dev"

  frontend:
    restart: unless-stopped
    image: node:22-alpine
    container_name: meetingroom-frontend-dev
    ports:
      - "3000:3000"
    environment:
      # 빈 값이면 frontend가 /api 프록시를 사용
      VITE_API_BASE_URL: ""
      # Docker에서는 프론트 컨테이너 내부에서 백엔드 서비스로 프록시해야 함
      VITE_PROXY_TARGET: "http://backend:3001"
      # 파일 변경 감지 이슈가 있으면 true로 두면 안정적(특히 Windows/WSL/네트워크 드라이브)
      CHOKIDAR_USEPOLLING: "true"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules_dev:/app/node_modules
    depends_on:
      - backend
    command: >
      sh -lc "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  backend_node_modules_dev:
  frontend_node_modules_dev:

